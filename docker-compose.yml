version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlops-api:latest
    container_name: mlops-api-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MODEL_SOURCE=${MODEL_SOURCE:-wandb}
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
